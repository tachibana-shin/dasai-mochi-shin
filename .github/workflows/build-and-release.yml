name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build web-config
        run: |
          cd web-config
          bun install --frozen-lockfile
          bun run build

      - name: Build firmware
        run: |
          pio run -e esp32-c3-devkitm-1
          pio run -e esp32-c3-devkitm-1 -t buildfs

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          BUILD_DIR=.pio/build/esp32-c3-devkitm-1
          for f in firmware.bin littlefs.bin bootloader.bin partitions.bin; do
            [ -f "$BUILD_DIR/$f" ] && cp "$BUILD_DIR/$f" "dist/$f" || true
          done

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
